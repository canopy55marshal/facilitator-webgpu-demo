 <!doctype html><html lang="zh-CN">  <head>    <meta charset="UTF-8" />    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    <title>促动师训练（零服务器 WebGPU）</title>    <style>      :root{        --bg:#0b0f14;--card:#111826;--text:#e6eef8;--muted:#9fb0c3;--border:rgba(255,255,255,.10);        --primary:#2dd4bf;--danger:#fb7185;      }      *{box-sizing:border-box}      body{        margin:0;        font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;        background: radial-gradient(1000px 800px at 10% 0%, rgba(45,212,191,.14), transparent 60%),                    radial-gradient(900px 700px at 90% 10%, rgba(251,113,133,.10), transparent 55%),                    var(--bg);        color:var(--text);      }      .wrap{max-width:980px;margin:24px auto;padding:0 16px}      .card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:14px}      h1{margin:0 0 6px;font-size:22px}      .muted{color:var(--muted)}      .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}      label{color:var(--muted);font-size:13px}      select, textarea{        background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);border-radius:10px;      }      select{padding:8px 10px;min-width:320px}      textarea{width:100%;padding:10px;resize:vertical;min-height:56px}      button{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}      button:disabled{opacity:.5;cursor:not-allowed}      .primary{border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.12)}      .danger{border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.12)}      .ghost{background:transparent}      .chat{height:320px;overflow:auto;padding:8px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.15)}      .msg{margin:10px 0;display:flex}      .bubble{max-width:80%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);line-height:1.5;white-space:pre-wrap}      .fac{justify-content:flex-end}      .fac .bubble{background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.25)}      .par .bubble{background:rgba(255,255,255,.04)}      .meta{font-size:12px;color:var(--muted);margin-bottom:4px}      .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}      .scenario{margin-top:10px;color:var(--muted);line-height:1.5;font-size:13px}      .status{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:12px}      .coach{white-space:pre-wrap;line-height:1.6}    </style>  </head>  <body>    <div class="wrap">      <div class="card">        <h1>促动师训练（零服务器 WebGPU）</h1>        <div class="muted">纯静态网页 + 浏览器本地推理（无需你购买云服务器）。首次会下载模型，之后缓存。</div>div>      </div>div>      <div class="card">        <div class="row">          <label>模型</label>          <select id="modelSel">            <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B（更快）</option>option>            <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B（更好一点）</option>option>          </select>select>          <button id="loadBtn" class="primary">加载模型</button>button>        </div>div>        <div id="loadStatus" class="status muted" style="margin-top:10px">未加载</div>div>      </div>div>      <div class="card">        <div class="row">          <label>场景</label>          <select id="sceneSel"></select>select>          <button id="newBtn" class="primary" disabled>开始</button>button>          <button id="exportBtn" class="ghost" disabled>导出</button>button>        </div>div>        <div id="sceneInfo" class="scenario"></div>div>      </div>div>      <div class="card">        <div id="chat" class="chat"></div>div>        <div style="margin-top:10px">          <textarea id="input" placeholder="输入你的问题（你是促动师）..." disabled></textarea>          <div class="actions">            <button id="sendBtn" class="primary" disabled>发送</button>button>            <button id="finishBtn" class="danger" disabled>完成（复盘）</button>button>          </div>div>        </div>div>      </div>div>      <div class="card">        <h2 style="margin:0 0 10px;font-size:16px">复盘结果</h2>        <div id="coach" class="coach muted">尚未完成练习。</div>div>      </div>div>    </div>div>    <script type="module" src="./main.js"></script>  </body></html>html></label></label></h1></body></style></title></head>
